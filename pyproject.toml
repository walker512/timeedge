[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "timeedge-lab"
version = "0.1.0"
description = "Explicit wall-clock scheduling boundary contracts and offline reports"
requires-python = ">=3.11"
authors = [{name = "walker512"}]
license = {text = "MIT"}
dependencies = ["tzdata>=2024.1; sys_platform == 'win32'"]
[project.scripts]
timeedge = "timeedge.__main__:main"
[tool.setuptools.packages.find]
include = ["timeedge*"]
